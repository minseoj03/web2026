<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <title>글자 수 카운터</title>
    <style>
        body {
            font-family: sans-serif;
            padding: 2rem;
            max-width: 600px;
            margin: 0 auto;
        }

        textarea {
            width: 100%;
            min-height: 200px;
            padding: 0.5rem;
            font-size: 1rem;
        }

        .count {
            color: #666;
            margin-top: 0.5rem;
            font-size: 0.9rem;
        }
    </style>
</head>

<body>
    <h1>나의 메모</h1>
    <textarea id="memoText" placeholder="여기에 글을 쓰세요..."></textarea>
    <div class="count">
        글자: <span id="charCount">0</span> · 단어: <span id="wordCount">0</span>
    </div>

    <script>
        const textarea = document.querySelector('#memoText');
        const charEl = document.querySelector('#charCount');
        const wordEl = document.querySelector('#wordCount');
        
        //ai: 이부분은 copilot 사용
        // 페이지 로드 시 localStorage에서 저장된 글 복원
    // TODO 1: 페이지 로드 시 localStorage에서 저장된 글 복원
    //         힌트: localStorage.getItem('memo'), textarea.value = ...
        const saved = localStorage.getItem('memo');
        if (saved !== null) {
            textarea.value = saved;
        }
        // 글자/단어 수 갱신 함수
        function updateCount() {
            const text = textarea.value;
            charEl.textContent = text.length;
            wordEl.textContent = text.trim().split(/\s+/).filter(w => w).length;
        }

    // TODO 2: textarea의 input 이벤트로 글자/단어 수 갱신 + localStorage 저장
    //힌트: text.length (글자 수), text.trim().split(/\s+/).filter(w => w).length (단어 수)
        // textarea 입력 시 이벤트 처리
        textarea.addEventListener('input', () => {
            updateCount();
            localStorage.setItem('memo', textarea.value);
        });
        // 초기 카운트 표시
        updateCount();

        


    </script>
</body>

</html>
