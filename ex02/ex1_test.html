<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
.parent{
position: relative;
border: 1px solid #000;
display: inline-block;
margin: 50px;
}
.badge{
position: absolute;
top: -10px;
right: -10px;
background: red;
color: white;
}
</style>
</head>
<body>
    <div class="parent">
        <img src="https://placehold.co/150"alt="Image">
        <div class="badge">New</div>
    </div>
    <div class="parent">
        <img src="https://placehold.co/200"alt="Image">
        <div class="badge">Sale</div>
    </div>
    
</body>
</html>
